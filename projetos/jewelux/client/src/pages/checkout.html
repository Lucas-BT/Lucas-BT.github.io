<!DOCTYPE html>
<html lang="pt_PT">
    <head>
        <meta charset="UTF-8">
        <link rel="icon" type="image/png" href="../../../client/img/icon_white.png" sizes="16x16 32x32" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <script src="https://kit.fontawesome.com/21b08f5882.js" crossorigin="anonymous"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Checkout</title>
        <link rel="stylesheet" href="../style.css">
        <script src="../checkout.js"></script>
    </head>
    <body class="body">
        <div class="container">
            <header class="header">
                <img src="../../img/logo_bgremoved.png" alt="">
                <h2>CHECKOUT</h2>
            </header>
            <div class="checkout-content">
                <div class="address-section">
                    <div class="accordion">
                        <div class="accordion-item">
                            <button class="accordion-button">Endereço de Entrega</button>
                            <div class="accordion-content">
                                <form id="delivery-form">
                                    <label for="name">Nome:</label>
                                    <input type="text" id="name" name="name" required>
                                    
                                    <label for="phone">Número:</label>
                                    <input type="tel" id="phone" name="phone" placeholder="Ex: 999111888" required>
                                    
                                    <label for="address">Morada:</label>
                                    <input type="text" id="address" name="address" placeholder="Ex: Rua da rua da vila da cidade, 2" required>
                                    
                                    <label for="postal-code">Código Postal:</label>
                                    <input type="text" id="postal-code" name="postal-code" placeholder="Ex: 6000-000" required>
                                    
                                    <label for="city">Cidade:</label>
                                    <input type="text" id="city" name="city" placeholder="Ex: Lisboa" required>
                                </form>
                            </div>
                        </div>
                        
                        <div class="accordion-item">
                            <button class="accordion-button">Método de Pagamento</button>
                            <div class="accordion-content">
                                <form id="payment-form">
                                    <input type="radio" id="paypal" name="payment-method" value="PayPal">
                                    <label for="paypal">PayPal</label><br>
                                    
                                    <input type="radio" id="credit-card" name="payment-method" value="Cartão de Crédito">
                                    <label for="credit-card">Cartão de Crédito</label><br>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="cart-summary" class="summary-section">
                    <h3>1 items</h3>
                    <div class="item">
                        <img src="image_url_placeholder" alt="Produto">
                        <div>
                            <p>99.99€</p>
                            <p>Fashion Ring - Tamanho S</p>
                            <input type="number" value="1" min="1">
                        </div>
                    </div>
                    <div class="total">
                        <span>Total:</span>
                        <span>99.99€</span>
                    </div>
                </div>
            </div>
            <button id="complete-order" class="btn btn-primary">Finalizar Compra</button>
        </div>
    </body>
</html>
