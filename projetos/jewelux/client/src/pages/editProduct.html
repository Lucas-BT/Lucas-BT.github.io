<!DOCTYPE html>
<html lang="pt_PT">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../../../client/img/icon_white.png" sizes="16x16 32x32" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/21b08f5882.js" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../editProduct.js"></script>
</head>
<body class="dark-mode">
    <div class="container-admin mt-5">
        <h2>Editar Produto</h2>
        <form id="edit-product-form">
            <div class="divForm">
                <label for="productName" class="form-label">Nome do Produto</label>
                <input type="text" class="inputs" id="productName" required>
            </div>
            <div class="divForm">
                <label for="productMaterial" class="form-label">Material do Produto</label>
                <input type="text" class="inputs" id="productMaterial" required>
            </div>
            <div class="divForm">
                <label for="productPrice" class="form-label">Preço</label>
                <input type="number" class="inputs" id="productPrice" step="0.01" required>
            </div>
            <div class="divForm">
                <label for="productDescription" class="form-label">Descrição</label>
                <textarea class="inputs" id="productDescription" rows="3" required></textarea>
            </div>
            <div class="divForm">
                <label for="productImage" class="form-label">Imagem do Produto</label>
                <input type="file" class="inputs" id="productImage" accept="image/*">
                <img id="currentImage" src="" alt="Imagem Atual do Produto" class="img-fluid mt-3">
            </div>
            <div class="divForm">
                <label for="productQuantity" class="form-label">Quantidade</label>
                <input type="number" class="inputs" id="productQuantity" required>
            </div>
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
        </form>
    </div>
</body>
</html>
