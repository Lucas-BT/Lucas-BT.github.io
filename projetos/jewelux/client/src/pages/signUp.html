<!DOCTYPE html>
<html lang="pt_PT">
    <head>
        <meta charset="UTF-8">
        <link rel="icon" type="image/png" href="../../../client/img/icon_white.png" sizes="16x16 32x32" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <script src="https://kit.fontawesome.com/21b08f5882.js" crossorigin="anonymous"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign-Up</title>
        <link rel="stylesheet" href="../style.css">
        <script src="../script.js"></script>
    </head>
<body>
    <a onclick="window.location.href = '../../index.html'" class="close"><i class="fa-solid fa-xmark"></i></a>

    <div class='form'>
        <div class='card'>
            <h1 id="info">Bem vindo/a, registe-se aqui</h1>
            <form>
                <div>
                    <label class='register'>Primeiro Nome:</label>
                    <input type='text' id="name" class='register' required/>
                </div>
                <div>
                    <label class='login'>Email:</label>
                    <input type='text' id="email" class='login' required/>
                </div>
                <div>
                    <label class='login'>Password:</label>
                    <input type="password" id="pass" class='login' required/>
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                </div>
                <div>
                    <label class='login'>Confirmar Password:</label>
                    <input type="password" id="Cpass" class='login' required/>
                </div>
                <div>
                    <label class='register'>Data de Nascimento</label>
                    <input type="date" id="dataNasc" class='register'/>
                </div>
                <div class="sexo-group">
                    <label class='register'>Sexo:</label>
                    <label>
                        <input type="radio" name="sexo" id="sexoM" class="sexo" value="Masculino"/> Masculino
                    </label>
                    <label>
                        <input type="radio" name="sexo" id="sexoF" class="sexo" value="Feminino"/> Feminino
                    </label>
                </div>
            </form>
            <div id="btnFormDiv">
                <button type="submit" id="btnRegistar" value='Registar' class="btnForm" onclick="SignUp()">
                    Registar-se
                </button>
                <button type="button" id="btnIniciar" value='Login' onclick="window.location.href='./login.html'">
                    Iniciar Sessão
                </button>
                <p id="output"></p>
            </div>
        </div>
    </div>
</body>
</html>
